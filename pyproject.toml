[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "backend/migrations",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["B008", "E712", "E501", "E402"]

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | backend/migrations
  | node_modules
)/
'''

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
